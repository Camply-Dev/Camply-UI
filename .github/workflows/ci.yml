name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Aucune étape ne pousse quoi que ce soit : la CI vérifie, elle ne corrige pas.
permissions:
  contents: read

jobs:
  # Un seul job : un checkout et une installation, puis les vérifications à la
  # suite. Cinq jobs refaisaient cinq fois les deux pour quelques secondes de
  # vérification chacun.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Vérification seule : l'auto-commit précédent poussait sur `main` au push,
      # échouait sur toute PR de fork (jeton en lecture seule) et faisait fusionner
      # un code que les autres jobs n'avaient jamais vu. Le formatage revient au dev
      # via `bun run fix`.
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run knip
      - run: bun run sync
      # Un composant ajouté sans `bun run sync` n'est ni dans le barrel ni dans la
      # map "exports" : il est absent du paquet publié, avec une CI verte.
      - name: "Barrel et map exports à jour ? (sinon : bun run sync)"
        run: git diff --exit-code -- src/index.ts package.json
      - run: bun run build
      - name: Le paquet publié est-il valide ? (exports, types, champs)
        run: bunx --bun publint@0.3.16 --strict
      # `du -sb` (taille apparente) et pas `du -sk` : ce dernier mesure l'occupation
      # disque, et 373 fichiers arrondis au bloc de 4 Ko sur ext4 pèsent ~2,5 Mo pour
      # 1,05 Mo de contenu — la garde partirait au rouge sans qu'un octet soit ajouté.
      # Seuil ~50 % au-dessus du réel (1,05 Mo, dont 536 Ko pour lib/icons.js) : on
      # attrape un saut de taille, pas la croissance normale.
      - name: Garde de taille du paquet
        run: |
          SIZE=$(( $(du -sb dist | cut -f1) / 1024 ))
          echo "dist = ${SIZE} Ko (seuil 1600)"
          test "$SIZE" -lt 1600
      - run: bun run docs:build
